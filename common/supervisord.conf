[supervisord]
nodaemon=true
logfile=/app/logs/supervisor/supervisord.log  ; Log file for Supervisor
loglevel=info  ; Set the log level (options: critical, error, warn, info, debug)
pidfile=/app/logs/supervisor/supervisord.pid  ; Optional: Specify a PID file


[program:django]
command=python manage.py runserver 0.0.0.0:8000
directory=/app
autostart=true
autorestart=true
stdout_logfile=/app/logs/django/django.log
stderr_logfile=/app/logs/django/django_err.log


[program:celery_worker]
command=celery -A deckoviz worker --loglevel=info --concurrency=4
directory=/app
autostart=true
autorestart=true
stdout_logfile=/app/logs/celery/celery-worker.log
stderr_logfile=/app/logs/celery/celery-worker_err.log


[program:celery_beat]
command=celery -A deckoviz beat --loglevel=info --schedule=/app/logs/celery/celerybeat-schedule
directory=/app
autostart=true
autorestart=true
stderr_logfile=/app/logs/celery/celery-beat_err.log
stdout_logfile=/app/logs/celery/celery-beat.log

[program:flower]
command=celery -A deckoviz flower --port=5555
directory=/app
autostart=true
autorestart=true
stdout_logfile=/app/logs/flower/flower.log
stderr_logfile=/app/logs/flower/flower_err.log