
services:
  common:
    container_name: common
    build: .
    env_file:
      - .env
    environment:
      - gio2y=backend_decoviz
      - PYTHONUNBUFFERED=1
    volumes:
      - .:/app:cached
    ports:
      - "8000:8000"
    depends_on:
      - redis
      - qdrant
    networks:
      - decoviz_common_default
    command: ["bash", "/app/scripts.sh"]

  redis:
    image: redis:latest
    restart: always
    ports:
      - "6379:6379"
    networks:
      - decoviz_common_default
    volumes:
      - redis_data:/data
      - ./logs/redis:/app/logs/redis  
    command: ["redis-server", "--requirepass", "redispassword"]
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "redispassword", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  qdrant:
    image: qdrant/qdrant
    container_name: qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    networks:
      - decoviz_common_default
    volumes:
      - ./logs/qdrant:/app/logs/qdrant
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6333/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  decoviz_api:
    container_name: decoviz_api
    build: .
    env_file:
      - .env
    environment:
      - APP_ENV=production
      - PYTHONUNBUFFERED=1
    volumes:
      - .:/app:cached
    ports:
      - "8080:8080"
    depends_on:
      - redis
      - qdrant
      - common
    networks:
      - decoviz_common_default
    command: >
      sh -c "uvicorn backend.decoviz_api.app:app 
             --host 0.0.0.0 
             --port 8080 
             --workers 4"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  streamlit_user_matching:
    container_name: streamlit_user_matching
    build: .
    env_file:
      - .env
    environment:
      - APP_ENV=production
    volumes:
      - .:/app:cached
    ports:
      - "8501:8501"
    command: ["streamlit", "run", "backend/streamlit_frontend/user_matching.py", "--server.port=8501"]
    depends_on:
      redis:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    networks:
      - decoviz_common_default

  streamlit_image_recommendation:
    container_name: streamlit_image_recommendation
    build: .
    env_file:
      - .env
    environment:
      - APP_ENV=production
    volumes:
      - .:/app:cached
    ports:
      - "8502:8502"
    command: ["streamlit", "run", "backend/streamlit_frontend/image_recommendation.py", "--server.port=8502"]
    depends_on:
      redis:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    networks:
      - decoviz_common_default

  streamlit_product_search:
    container_name: streamlit_product_search
    build: .
    env_file:
      - .env
    environment:
      - APP_ENV=production
    volumes:
      - .:/app:cached
    ports:
      - "8503:8503"
    command: ["streamlit", "run", "backend/streamlit_frontend/product_search.py", "--server.port=8503"]
    depends_on:
      redis:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    networks:
      - decoviz_common_default

networks:
  decoviz_common_default: 
    driver: bridge

volumes:
  redis_data:
  qdrant_data:
