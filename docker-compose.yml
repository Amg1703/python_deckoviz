services: 

  redis:
    image: redis:latest
    restart: always
    ports:
      - "6379:6379"
    networks:
      - decoviz_common_default
    volumes:
      - redis_data:/data
      - ./logs/redis:/app/logs/redis  
    command: ["redis-server", "--requirepass", "redispassword"]
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "redispassword", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  qdrant:
    image: qdrant/qdrant
    container_name: qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    networks:
      - decoviz_common_default
    volumes:
      - qdrant_data:/qdrant/storage
      - ./logs/qdrant:/app/logs/qdrant
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6333/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  common:
    build:
      context: ./common
      dockerfile: Dockerfile
    image: common:latest
    container_name: common
    env_file:
      - .env
    ports:
      - "8000:8000"
    command: bash -c "python manage.py makemigrations && python manage.py migrate && python manage.py runserver 0.0.0.0:8000"
    depends_on:
      - redis
      - qdrant
    networks:
      - decoviz_common_default
    volumes:
      - ./common:/app

  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    env_file:
      - ./api/.env
    image: api:latest
    container_name: api
    ports:
      - "8080:8080"
    environment:
      - PYTHONPATH=/app
    command: uvicorn main:app --host 0.0.0.0 --port 8080
    depends_on:
      - redis
      - qdrant
    networks:
      - decoviz_common_default
    volumes:
      - ./api:/app

  deckoviz_ai:
    build:
      context: .
      dockerfile: deckoviz_ai/Dockerfile
    image: deckoviz_ai:latest
    env_file:
      - ./deckoviz_ai/.env
    container_name: deckoviz_ai
    ports:
      - "8501:8501"
    depends_on:
      - redis
      - qdrant
    networks:
      - decoviz_common_default
    volumes:
      - ./deckoviz_ai:/app

volumes:
  redis_data:
  qdrant_data:

networks:
  decoviz_common_default: 
    driver: bridge