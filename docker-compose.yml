services: 

  redis:
    image: redis:latest
    restart: always
    ports:
      - "6379:6379"
    networks:
      - decoviz_common_default
    volumes:
      - redis_data:/data
      - ./logs/redis:/app/logs/redis  
    command: ["redis-server", "--requirepass", "redispassword"]
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "redispassword", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      
  flower:
    container_name: flower
    image: mher/flower
    restart: always
    env_file:
      - .env
    environment:
      - FLOWER_BASIC_AUTH=${FLOWER_USERNAME}:${FLOWER_PASSWORD} 
      - FLOWER_BROKER=${REDIS_URL}
    ports:
      - "5555:5555"
    networks:
      - decoviz_common_default
    depends_on:
      - redis
      - celery_worker
    command: celery -A decoviz flower --port=5555 --broker=${REDIS_URL}

  celery_worker:
    container_name: celery_worker
    build:
      context: .
      dockerfile: common/Dockerfile
    env_file:
      - .env
    volumes:
      - ./deckoviz_ai:/app/deckoviz_ai
      - ./logs/celery:/app/logs/celery 
    networks:
      - decoviz_common_default
    depends_on:
      - redis
      - deckoviz_ai
    command: ["/usr/bin/supervisord"]

  qdrant:
    image: qdrant/qdrant
    container_name: qdrant
    env_file:
      - .env
    ports:
      - "6333:6333"
      - "6334:6334"
    networks:
      - decoviz_common_default
    volumes:
      - qdrant_data:/qdrant/storage
      - ./logs/qdrant:/app/logs/qdrant
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6333/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  common:
    build:
      context: .
      dockerfile: common/Dockerfile
    image: common:latest
    container_name: common
    env_file:
      - .env
    ports:
      - "8000:8000"
    volumes:
      - ./common:/app
    command: ["bash", "/app/scripts.sh"]
    depends_on:
      - redis
      - qdrant
      - deckoviz_ai
    networks:
      - decoviz_common_default

  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    env_file:
      - ./api/.env
    image: api:latest
    container_name: api
    ports:
      - "8080:8080"
    environment:
      - PYTHONPATH=/app
    command: uvicorn main:app --host 0.0.0.0 --port 8080 --reload
    depends_on:
      - redis
      - qdrant
    networks:
      - decoviz_common_default
    volumes:
      - ./api:/app
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/" , "||" , "exit", "1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

  deckoviz_ai:
    build:
      context: .
      dockerfile: deckoviz_ai/Dockerfile
    image: deckoviz_ai:latest
    container_name: deckoviz_ai
    ports:
      - "8001:8001"
    environment:
      - PYTHONPATH=/app
    env_file:
      - ./deckoviz_ai/.env
    networks:
      - decoviz_common_default
    volumes:
      - ./deckoviz_ai:/app
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/" , "||" , "exit", "1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    command: uvicorn main:app --host 0.0.0.0 --port 8001 --reload


volumes:
  redis_data:
  qdrant_data:

networks:
  decoviz_common_default: 
    driver: bridge